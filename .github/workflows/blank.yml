name: Compilar VST3 Plugin

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Compilar proyecto
        run: cmake --build build --config Release

      - name: Preparar archivo ZIP para FL Studio
        shell: pwsh
        run: |
          $vstPath = "build/ScarlettWarmth_artefacts/Release/VST3/Scarlett Warmth Preamp.vst3"
          if (!(Test-Path $vstPath)) {
              $vstPath = "build/ScarlettWarmth_artefacts/Release/VST3"
          }
          Compress-Archive -Path $vstPath -DestinationPath "ScarlettWarmth_VST3_ListoParaFLStudio.zip"

      - name: Subir Artifact (Plugin listo)
        uses: actions/upload-artifact@v4
        with:
          name: ScarlettWarmth_VST3_ListoParaFLStudio
          path: ScarlettWarmth_VST3_ListoParaFLStudio.zip
